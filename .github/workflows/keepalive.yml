name: Keep Streamlit app awake

on:
  schedule:
    # Ping the hosted Streamlit app every 30 minutes so it is less likely to idle.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping transcription app
        run: |
          set -euo pipefail
          URL="https://transcription-webapp.streamlit.app/healthz"
          echo "Pinging $URL"
          STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 60 "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Unexpected status from $URL: $STATUS" >&2
            exit 1
          fi
